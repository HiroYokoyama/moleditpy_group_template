name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Unit tests. Real PyQt6 and real RDKit: the palette is a widget grid and
  # every template is built by RDKit, so a mocked tier would test almost
  # nothing here.
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install pytest pytest-cov PyQt6 rdkit

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=group_template --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Integration tests — clones the main app so the API checker and the
  # host-contract tests run against real MoleditPy source. Placement shadows a
  # scene method that is not part of PluginContext, so this tier is the only
  # thing that would catch the host renaming it.
  # -------------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install pytest PyQt6 rdkit

      - name: Clone main MoleditPy application
        run: |
          git clone --depth 1 \
            https://github.com/HiroYokoyama/python_molecular_editor.git \
            ../python_molecular_editor

      - name: Run host-contract and API tests
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
          QT_QPA_PLATFORM: offscreen
        # -rs prints skip reasons: a silently skipped tier looks exactly like a
        # passing one in the log.
        run: python -m pytest tests/test_host_contract.py tests/test_api.py -v -rs

      - name: Fail if the main-app tier did not actually run
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_host_contract.py tests/test_api.py \
            -q --no-header -rs > tier.log 2>&1 || true
          cat tier.log
          if grep -q "skipped" tier.log; then
            echo "::error::The main-app tests skipped; this job exists to run them."
            exit 1
          fi
